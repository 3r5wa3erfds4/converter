<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFlag Config Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #007acc;
            padding-bottom: 10px;
            display: inline-block;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
        }

        .panel h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: normal;
            border-left: 3px solid #007acc;
            padding-left: 10px;
        }

        .upload-area {
            border: 1px dashed #ccc;
            border-radius: 4px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .upload-area:hover {
            background: #f0f0f0;
        }

        .file-input {
            display: none;
        }

        .file-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 8px 12px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .file-name {
            color: #333;
            word-break: break-all;
            flex: 1;
        }

        .remove-file {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .remove-file:hover {
            background: #c82333;
        }

        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #005fa3;
        }

        .generate-btn {
            width: 100%;
            margin-top: 15px;
            background: #28a745;
        }

        .generate-btn:hover {
            background: #218838;
        }

        .output-area {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .output-buttons {
            display: flex;
            gap: 10px;
        }

        .copy-btn {
            background: #28a745;
        }

        .download-btn {
            background: #17a2b8;
        }

        .clear-btn {
            background: #dc3545;
        }

        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            color: #666;
        }

        .prefix-info {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 12px;
            margin-top: 15px;
            font-size: 12px;
        }

        .prefix-info h3 {
            font-size: 13px;
            margin-bottom: 10px;
            color: #333;
        }

        .prefix-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        .prefix-item {
            color: #555;
        }

        .prefix-name {
            font-weight: bold;
            color: #007acc;
        }

        .empty-message {
            color: #999;
            text-align: center;
            padding: 20px;
        }

        hr {
            margin: 15px 0;
            border: none;
            border-top: 1px solid #eee;
        }

        @media (max-width: 700px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FFlag Config Generator</h1>

        <div class="main-content">
            <div class="panel">
                <h2>Upload Files</h2>
                <div class="upload-area" id="uploadArea">
                    <div>📂 Click or drag files here</div>
                    <small style="color: #888;">.json or .txt files</small>
                    <input type="file" id="fileInput" multiple accept=".json,.txt" class="file-input">
                </div>

                <div id="fileList" class="file-list">
                    <div class="empty-message">No files uploaded</div>
                </div>

                <button class="generate-btn" id="generateBtn">Generate Config</button>

                <div class="prefix-info">
                    <h3>Supported Prefixes</h3>
                    <div class="prefix-grid">
                        <div class="prefix-item"><span class="prefix-name">DFFlag</span> = bool</div>
                        <div class="prefix-item"><span class="prefix-name">DFInt</span> = number</div>
                        <div class="prefix-item"><span class="prefix-name">DFLog</span> = number</div>
                        <div class="prefix-item"><span class="prefix-name">DFString</span> = string</div>
                        <div class="prefix-item"><span class="prefix-name">FFlag</span> = bool</div>
                        <div class="prefix-item"><span class="prefix-name">FInt</span> = number</div>
                        <div class="prefix-item"><span class="prefix-name">FLog</span> = string</div>
                        <div class="prefix-item"><span class="prefix-name">FString</span> = string</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="output-header">
                    <h2>Output</h2>
                    <div class="output-buttons">
                        <button class="copy-btn" id="copyBtn">Copy</button>
                        <button class="download-btn" id="downloadBtn">Download</button>
                        <button class="clear-btn" id="clearBtn">Clear</button>
                    </div>
                </div>
                <div class="output-area" id="outputArea">
                    <span style="color: #888;">No config generated</span>
                </div>
                <div class="stats" id="stats"></div>
            </div>
        </div>
    </div>

    <script>
        let uploadedFiles = [];

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileListDiv = document.getElementById('fileList');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const outputArea = document.getElementById('outputArea');
        const statsDiv = document.getElementById('stats');

        function showMessage(msg, isError = false) {
            const el = document.createElement('div');
            el.textContent = msg;
            el.style.cssText = `position:fixed;bottom:20px;right:20px;background:${isError ? '#dc3545' : '#28a745'};color:white;padding:8px 16px;border-radius:4px;font-size:13px;z-index:1000`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function parseFileContent(content, filename) {
            const result = {};
            
            try {
                if (filename.toLowerCase().endsWith('.json')) {
                    const data = JSON.parse(content);
                    if (typeof data === 'object' && data !== null) {
                        for (const [key, value] of Object.entries(data)) {
                            if (!key.startsWith('//')) result[key] = value;
                        }
                    }
                } else {
                    try {
                        const data = JSON.parse(content);
                        if (typeof data === 'object' && data !== null) {
                            for (const [key, value] of Object.entries(data)) {
                                if (!key.startsWith('//')) result[key] = value;
                            }
                            return result;
                        }
                    } catch (e) {
                        const lines = content.split('\n');
                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed && !trimmed.startsWith('#') && !trimmed.startsWith('//')) {
                                if (trimmed.includes('=')) {
                                    const flag = trimmed.split('=')[0].trim();
                                    const value = trimmed.substring(trimmed.indexOf('=') + 1).trim();
                                    result[flag] = value;
                                } else if (trimmed.includes(':')) {
                                    try {
                                        const flag = trimmed.split(':')[0].trim().replace(/["']/g, '');
                                        const value = trimmed.substring(trimmed.indexOf(':') + 1).trim().replace(/["',]/g, '');
                                        result[flag] = value;
                                    } catch (e) {
                                        result[trimmed] = "";
                                    }
                                } else {
                                    result[trimmed] = "";
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                throw new Error(`Failed to parse ${filename}: ${e.message}`);
            }
            
            return result;
        }

        function toLuaValue(value) {
            if (typeof value === 'boolean') return value ? 'true' : 'false';
            if (typeof value === 'number') return value.toString();
            if (typeof value === 'string') {
                const lower = value.toLowerCase();
                if (lower === 'true') return 'true';
                if (lower === 'false') return 'false';
                const num = Number(value);
                if (!isNaN(num)) return num.toString();
                return `"${value.replace(/"/g, '\\"')}"`;
            }
            return `"${String(value).replace(/"/g, '\\"')}"`;
        }

        function generateConfig() {
            if (uploadedFiles.length === 0) {
                showMessage('Please upload files first!', true);
                return null;
            }

            const allFlags = {};
            
            for (const file of uploadedFiles) {
                try {
                    const flags = parseFileContent(file.content, file.name);
                    Object.assign(allFlags, flags);
                } catch (e) {
                    showMessage(e.message, true);
                    return null;
                }
            }

            if (Object.keys(allFlags).length === 0) {
                showMessage('No valid FFlags found!', true);
                return null;
            }

            const lines = ['getgenv().fast_flags = {'];
            const entries = Object.entries(allFlags);
            
            for (let i = 0; i < entries.length; i++) {
                const [flag, value] = entries[i];
                const isLast = i === entries.length - 1;
                lines.push(`    ${flag} = ${toLuaValue(value)}${isLast ? '' : ','}`);
            }
            
            lines.push('}');
            
            return {
                config: lines.join('\n'),
                stats: `Total: ${Object.keys(allFlags).length} flags | Files: ${uploadedFiles.length}`
            };
        }

        function updateOutput() {
            const result = generateConfig();
            if (result) {
                outputArea.textContent = result.config;
                statsDiv.textContent = result.stats;
            }
        }

        function handleFiles(files) {
            const validFiles = Array.from(files).filter(f => 
                f.name.toLowerCase().endsWith('.json') || f.name.toLowerCase().endsWith('.txt')
            );
            
            if (validFiles.length === 0) {
                showMessage('Upload .json or .txt files only!', true);
                return;
            }

            let processed = 0;
            validFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedFiles.push({ name: file.name, content: e.target.result });
                    processed++;
                    if (processed === validFiles.length) {
                        renderFileList();
                        showMessage(`Added ${validFiles.length} file(s)`);
                    }
                };
                reader.onerror = () => {
                    processed++;
                    showMessage(`Error reading ${file.name}`, true);
                };
                reader.readAsText(file);
            });
        }

        function renderFileList() {
            if (uploadedFiles.length === 0) {
                fileListDiv.innerHTML = '<div class="empty-message">No files uploaded</div>';
                return;
            }
            
            fileListDiv.innerHTML = uploadedFiles.map((file, idx) => `
                <div class="file-item">
                    <span class="file-name">📄 ${file.name}</span>
                    <button class="remove-file" data-index="${idx}">Remove</button>
                </div>
            `).join('');
            
            document.querySelectorAll('.remove-file').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.index);
                    uploadedFiles.splice(idx, 1);
                    renderFileList();
                    const result = generateConfig();
                    if (result) {
                        outputArea.textContent = result.config;
                        statsDiv.textContent = result.stats;
                    } else if (uploadedFiles.length === 0) {
                        outputArea.innerHTML = '<span style="color: #888;">No config generated</span>';
                        statsDiv.textContent = '';
                    }
                    showMessage('File removed');
                });
            });
        }

        function copyToClipboard() {
            const text = outputArea.textContent;
            if (!text || text.includes('No config generated')) {
                showMessage('Nothing to copy!', true);
                return;
            }
            navigator.clipboard.writeText(text).then(() => showMessage('Copied!')).catch(() => showMessage('Failed to copy', true));
        }

        function downloadConfig() {
            const text = outputArea.textContent;
            if (!text || text.includes('No config generated')) {
                showMessage('Nothing to download!', true);
                return;
            }
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `fflag_config.lua`;
            a.click();
            URL.revokeObjectURL(url);
            showMessage('Download started');
        }

        function clearAll() {
            uploadedFiles = [];
            renderFileList();
            outputArea.innerHTML = '<span style="color: #888;">No config generated</span>';
            statsDiv.textContent = '';
            showMessage('Cleared');
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        generateBtn.addEventListener('click', updateOutput);
        copyBtn.addEventListener('click', copyToClipboard);
        downloadBtn.addEventListener('click', downloadConfig);
        clearBtn.addEventListener('click', clearAll);

        uploadArea.addEventListener('dragover', (e) => e.preventDefault());
        uploadArea.addEventListener('dragleave', (e) => e.preventDefault());
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files);
        });

        renderFileList();
    </script>
</body>
</html>
