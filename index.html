<!DOCTYPE html>
<html>
<head>
    <title>Generator</title>
</head>
<body>

<input type="file" id="fileInput" multiple accept=".json,.txt">
<button id="generateBtn">Generate</button>
<button id="copyBtn">Copy</button>
<button id="clearBtn">Clear</button>

<div id="fileList"></div>
<div id="stats"></div>
<br>
<textarea id="outputArea" rows="20" cols="100" readonly placeholder="Output will appear here..."></textarea>

<script>
    let uploadedFiles = [];

    const fileInput = document.getElementById('fileInput');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const outputArea = document.getElementById('outputArea');
    const fileListDiv = document.getElementById('fileList');
    const statsDiv = document.getElementById('stats');

    // FFlag prefixes to remove
    const prefixes = ['FFlag', 'DFInt', 'FInt', 'DFFlag', 'DFLog', 'FLog', 'DFString', 'FString'];

    function removePrefix(flagName) {
        for (const prefix of prefixes) {
            if (flagName.startsWith(prefix)) {
                return flagName.substring(prefix.length);
            }
        }
        return flagName;
    }

    function showMessage(msg) {
        const el = document.createElement('div');
        el.textContent = msg;
        el.style.cssText = 'position:fixed;bottom:20px;right:20px;background:black;color:white;padding:5px;z-index:1000';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }

    function parseFileContent(content, filename) {
        const result = {};
        
        try {
            if (filename.toLowerCase().endsWith('.json')) {
                const data = JSON.parse(content);
                if (typeof data === 'object' && data !== null) {
                    for (const [key, value] of Object.entries(data)) {
                        if (!key.startsWith('//')) {
                            const cleanKey = removePrefix(key);
                            result[cleanKey] = value;
                        }
                    }
                }
            } else {
                try {
                    const data = JSON.parse(content);
                    if (typeof data === 'object' && data !== null) {
                        for (const [key, value] of Object.entries(data)) {
                            if (!key.startsWith('//')) {
                                const cleanKey = removePrefix(key);
                                result[cleanKey] = value;
                            }
                        }
                        return result;
                    }
                } catch (e) {
                    const lines = content.split('\n');
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed && !trimmed.startsWith('#') && !trimmed.startsWith('//')) {
                            if (trimmed.includes('=')) {
                                let flag = trimmed.split('=')[0].trim();
                                const value = trimmed.substring(trimmed.indexOf('=') + 1).trim();
                                const cleanKey = removePrefix(flag);
                                result[cleanKey] = value;
                            } else if (trimmed.includes(':')) {
                                try {
                                    let flag = trimmed.split(':')[0].trim().replace(/["']/g, '');
                                    const value = trimmed.substring(trimmed.indexOf(':') + 1).trim().replace(/["',]/g, '');
                                    const cleanKey = removePrefix(flag);
                                    result[cleanKey] = value;
                                } catch (e) {
                                    const cleanKey = removePrefix(trimmed);
                                    result[cleanKey] = "";
                                }
                            } else {
                                const cleanKey = removePrefix(trimmed);
                                result[cleanKey] = "";
                            }
                        }
                    }
                }
            }
        } catch (e) {
            throw new Error(`Error parsing ${filename}: ${e.message}`);
        }
        
        return result;
    }

    function toLuaValue(value) {
        if (typeof value === 'boolean') return value ? 'true' : 'false';
        if (typeof value === 'number') return value.toString();
        if (typeof value === 'string') {
            const lower = value.toLowerCase();
            if (lower === 'true') return 'true';
            if (lower === 'false') return 'false';
            const num = Number(value);
            if (!isNaN(num)) return num.toString();
            return `"${value.replace(/"/g, '\\"')}"`;
        }
        return `"${String(value).replace(/"/g, '\\"')}"`;
    }

    function generateConfig() {
        if (uploadedFiles.length === 0) {
            showMessage('Upload files first');
            return null;
        }

        const allFlags = {};
        
        for (const file of uploadedFiles) {
            try {
                const flags = parseFileContent(file.content, file.name);
                Object.assign(allFlags, flags);
            } catch (e) {
                showMessage(e.message);
                return null;
            }
        }

        if (Object.keys(allFlags).length === 0) {
            showMessage('No valid FFlags found');
            return null;
        }

        const lines = ['getgenv().fast_flags = {'];
        const entries = Object.entries(allFlags);
        
        for (let i = 0; i < entries.length; i++) {
            const [flag, value] = entries[i];
            const isLast = i === entries.length - 1;
            lines.push(`    ${flag} = ${toLuaValue(value)}${isLast ? '' : ','}`);
        }
        
        lines.push('}');
        
        return {
            config: lines.join('\n'),
            count: Object.keys(allFlags).length
        };
    }

    function updateOutput() {
        const result = generateConfig();
        if (result) {
            outputArea.value = result.config;
            statsDiv.textContent = `Flags: ${result.count} | Files: ${uploadedFiles.length}`;
        } else if (uploadedFiles.length === 0) {
            outputArea.value = '';
            statsDiv.textContent = '';
        }
    }

    function handleFiles(files) {
        const validFiles = Array.from(files).filter(f => 
            f.name.toLowerCase().endsWith('.json') || f.name.toLowerCase().endsWith('.txt')
        );
        
        if (validFiles.length === 0) {
            showMessage('Use .json or .txt files');
            return;
        }

        let processed = 0;
        validFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedFiles.push({ name: file.name, content: e.target.result });
                processed++;
                if (processed === validFiles.length) {
                    renderFileList();
                    showMessage(`Added ${validFiles.length} file(s)`);
                    updateOutput();
                }
            };
            reader.onerror = () => {
                processed++;
                showMessage(`Error: ${file.name}`);
            };
            reader.readAsText(file);
        });
    }

    function renderFileList() {
        if (uploadedFiles.length === 0) {
            fileListDiv.innerHTML = '';
            return;
        }
        
        fileListDiv.innerHTML = uploadedFiles.map((file, idx) => `
            <div>
                ${file.name} <button data-index="${idx}">Remove</button>
            </div>
        `).join('');
        
        document.querySelectorAll('[data-index]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.index);
                uploadedFiles.splice(idx, 1);
                renderFileList();
                updateOutput();
                if (uploadedFiles.length === 0) {
                    outputArea.value = '';
                    statsDiv.textContent = '';
                }
                showMessage('Removed');
            });
        });
    }

    function copyToClipboard() {
        if (!outputArea.value) {
            showMessage('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(outputArea.value).then(() => showMessage('Copied!'));
    }

    function clearAll() {
        uploadedFiles = [];
        renderFileList();
        outputArea.value = '';
        statsDiv.textContent = '';
        fileInput.value = '';
        showMessage('Cleared');
    }

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    generateBtn.addEventListener('click', updateOutput);
    copyBtn.addEventListener('click', copyToClipboard);
    clearBtn.addEventListener('click', clearAll);

    renderFileList();
</script>
</body>
</html>
