<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FFlag Config Generator</title>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            background: white;
        }
        button {
            font-size: 14px;
            padding: 5px 10px;
            margin-right: 5px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 400px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
        }
        .file-list {
            margin: 10px 0;
            font-size: 13px;
        }
        .file-item {
            margin: 3px 0;
        }
        hr {
            margin: 15px 0;
        }
    </style>
</head>
<body>

<h3>FFlag Config Generator</h3>

<input type="file" id="fileInput" multiple accept=".json,.txt">
<button id="generateBtn">Generate</button>
<button id="copyBtn">Copy</button>
<button id="downloadBtn">Download</button>
<button id="clearBtn">Clear</button>

<div id="fileList" class="file-list"></div>
<div id="stats" style="margin: 10px 0; font-size: 13px;"></div>

<textarea id="outputArea" readonly placeholder="Output will appear here..."></textarea>

<script>
    let uploadedFiles = [];

    const fileInput = document.getElementById('fileInput');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const outputArea = document.getElementById('outputArea');
    const fileListDiv = document.getElementById('fileList');
    const statsDiv = document.getElementById('stats');

    function showMessage(msg) {
        const el = document.createElement('div');
        el.textContent = msg;
        el.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#333;color:white;padding:5px 10px;font-size:12px;z-index:1000';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }

    function parseFileContent(content, filename) {
        const result = {};
        
        try {
            if (filename.toLowerCase().endsWith('.json')) {
                const data = JSON.parse(content);
                if (typeof data === 'object' && data !== null) {
                    for (const [key, value] of Object.entries(data)) {
                        if (!key.startsWith('//')) result[key] = value;
                    }
                }
            } else {
                try {
                    const data = JSON.parse(content);
                    if (typeof data === 'object' && data !== null) {
                        for (const [key, value] of Object.entries(data)) {
                            if (!key.startsWith('//')) result[key] = value;
                        }
                        return result;
                    }
                } catch (e) {
                    const lines = content.split('\n');
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed && !trimmed.startsWith('#') && !trimmed.startsWith('//')) {
                            if (trimmed.includes('=')) {
                                const flag = trimmed.split('=')[0].trim();
                                const value = trimmed.substring(trimmed.indexOf('=') + 1).trim();
                                result[flag] = value;
                            } else if (trimmed.includes(':')) {
                                try {
                                    const flag = trimmed.split(':')[0].trim().replace(/["']/g, '');
                                    const value = trimmed.substring(trimmed.indexOf(':') + 1).trim().replace(/["',]/g, '');
                                    result[flag] = value;
                                } catch (e) {
                                    result[trimmed] = "";
                                }
                            } else {
                                result[trimmed] = "";
                            }
                        }
                    }
                }
            }
        } catch (e) {
            throw new Error(`Error parsing ${filename}: ${e.message}`);
        }
        
        return result;
    }

    function toLuaValue(value) {
        if (typeof value === 'boolean') return value ? 'true' : 'false';
        if (typeof value === 'number') return value.toString();
        if (typeof value === 'string') {
            const lower = value.toLowerCase();
            if (lower === 'true') return 'true';
            if (lower === 'false') return 'false';
            const num = Number(value);
            if (!isNaN(num)) return num.toString();
            return `"${value.replace(/"/g, '\\"')}"`;
        }
        return `"${String(value).replace(/"/g, '\\"')}"`;
    }

    function generateConfig() {
        if (uploadedFiles.length === 0) {
            showMessage('Upload files first');
            return null;
        }

        const allFlags = {};
        
        for (const file of uploadedFiles) {
            try {
                const flags = parseFileContent(file.content, file.name);
                Object.assign(allFlags, flags);
            } catch (e) {
                showMessage(e.message);
                return null;
            }
        }

        if (Object.keys(allFlags).length === 0) {
            showMessage('No valid FFlags found');
            return null;
        }

        const lines = ['getgenv().fast_flags = {'];
        const entries = Object.entries(allFlags);
        
        for (let i = 0; i < entries.length; i++) {
            const [flag, value] = entries[i];
            const isLast = i === entries.length - 1;
            lines.push(`    ${flag} = ${toLuaValue(value)}${isLast ? '' : ','}`);
        }
        
        lines.push('}');
        
        return {
            config: lines.join('\n'),
            count: Object.keys(allFlags).length
        };
    }

    function updateOutput() {
        const result = generateConfig();
        if (result) {
            outputArea.value = result.config;
            statsDiv.textContent = `Flags: ${result.count} | Files: ${uploadedFiles.length}`;
        } else if (uploadedFiles.length === 0) {
            outputArea.value = '';
            statsDiv.textContent = '';
        }
    }

    function handleFiles(files) {
        const validFiles = Array.from(files).filter(f => 
            f.name.toLowerCase().endsWith('.json') || f.name.toLowerCase().endsWith('.txt')
        );
        
        if (validFiles.length === 0) {
            showMessage('Use .json or .txt files');
            return;
        }

        let processed = 0;
        validFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedFiles.push({ name: file.name, content: e.target.result });
                processed++;
                if (processed === validFiles.length) {
                    renderFileList();
                    showMessage(`Added ${validFiles.length} file(s)`);
                    updateOutput();
                }
            };
            reader.onerror = () => {
                processed++;
                showMessage(`Error: ${file.name}`);
            };
            reader.readAsText(file);
        });
    }

    function renderFileList() {
        if (uploadedFiles.length === 0) {
            fileListDiv.innerHTML = '';
            return;
        }
        
        fileListDiv.innerHTML = uploadedFiles.map((file, idx) => `
            <div class="file-item">
                📄 ${file.name} 
                <button style="margin-left:10px; padding:2px 6px;" data-index="${idx}">x</button>
            </div>
        `).join('');
        
        document.querySelectorAll('[data-index]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.index);
                uploadedFiles.splice(idx, 1);
                renderFileList();
                updateOutput();
                if (uploadedFiles.length === 0) {
                    outputArea.value = '';
                    statsDiv.textContent = '';
                }
                showMessage('Removed');
            });
        });
    }

    function copyToClipboard() {
        if (!outputArea.value) {
            showMessage('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(outputArea.value).then(() => showMessage('Copied!'));
    }

    function downloadConfig() {
        if (!outputArea.value) {
            showMessage('Nothing to download');
            return;
        }
        const blob = new Blob([outputArea.value], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fflag_config.lua`;
        a.click();
        URL.revokeObjectURL(url);
        showMessage('Downloaded');
    }

    function clearAll() {
        uploadedFiles = [];
        renderFileList();
        outputArea.value = '';
        statsDiv.textContent = '';
        fileInput.value = '';
        showMessage('Cleared');
    }

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    generateBtn.addEventListener('click', updateOutput);
    copyBtn.addEventListener('click', copyToClipboard);
    downloadBtn.addEventListener('click', downloadConfig);
    clearBtn.addEventListener('click', clearAll);

    renderFileList();
</script>
</body>
</html>
